<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function() {
        try {
          var font = localStorage.getItem('hyperpos_app_font');
          if (font) font = font.trim().replace(/^['"]|['"]$/g, '');
          if (!font || !['cairo', 'tajawal', 'ibm-plex', 'almarai', 'readex'].includes(font)) {
            font = 'cairo';
          }
          document.documentElement.setAttribute('data-font', font);
          var lang = localStorage.getItem('hyperpos_language');
          if (!lang || !['ar', 'en', 'tr', 'fa', 'ku'].includes(lang)) {
            localStorage.setItem('hyperpos_language', 'ar');
            lang = 'ar';
          }
          // Paired UI Scale Map matching UI_SCALE_MAP in src/lib/ui-scale-config.ts
          // DEFAULT_UI_SCALE_ID = '100' (14px)
          var scale = localStorage.getItem('hyperpos_ui_scale');
          if (!scale) {
            try {
              var rawSettings = localStorage.getItem('hyperpos_settings_v1');
              if (rawSettings) {
                var parsed = JSON.parse(rawSettings);
                scale = parsed && (parsed.uiScale || (parsed.sync_settings && parsed.sync_settings.uiScale));
              }
            } catch (err) {}
          }
          if (scale) scale = String(scale).trim().replace(/^['"]|['"]$/g, '');
          var scaleMap = { '60': '8.4px', '70': '9.8px', '80': '11.2px', '90': '12.6px', '100': '14px', '110': '15.4px', '120': '16.8px' };
          var defaultScale = '80';
          var activeScale = scaleMap[scale] ? scale : defaultScale;
          var scalePx = scaleMap[activeScale] || '11.2px';
          document.documentElement.style.fontSize = scalePx;
          document.documentElement.setAttribute('data-ui-scale', activeScale);
          var isRtl = lang === 'ar' || lang === 'fa' || lang === 'ku';
          document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.classList.remove('rtl', 'ltr');
          document.documentElement.classList.add(isRtl ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
    <title>FlowPOS Pro - نظام إدارة محاسبي متكامل</title>
    
    <!-- Font Preloads (font-display: swap & zero FOIT) -->
    <link rel="preload" href="/fonts/5-SLXVc1nY6HkvangtZmpQdkhzfH5lkSscQyyS4J0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/NotoSansArabic-Regular.ttf" as="font" type="font/ttf" crossorigin />

    <!-- App Icon / Favicon -->
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="description" content="نظام إدارة محاسبي متكامل لمحلات الهواتف والصيانة والمحلات التجارية" />
    <meta name="author" content="FlowPOS Pro" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="FlowPOS Pro - نظام إدارة محاسبي متكامل" />
    <meta property="og:description" content="نظام إدارة محاسبي متكامل لمحلات الهواتف والصيانة والمحلات التجارية" />
    <meta property="og:type" content="website" />

  </head>

  </body>
</html>
