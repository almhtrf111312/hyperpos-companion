<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function() {
        try {
          var font = localStorage.getItem('hyperpos_app_font');
          if (font) font = font.trim().replace(/^['"]|['"]$/g, '');
          if (!font || !['cairo', 'tajawal', 'ibm-plex', 'almarai', 'readex'].includes(font)) {
            font = 'cairo';
          }
          document.documentElement.setAttribute('data-font', font);
          var lang = localStorage.getItem('hyperpos_language');
          if (!lang || !['ar', 'en', 'tr', 'fa', 'ku'].includes(lang)) {
            localStorage.setItem('hyperpos_language', 'ar');
            lang = 'ar';
          }
          var scale = localStorage.getItem('hyperpos_ui_scale');
          if (scale) scale = scale.trim().replace(/^['"]|['"]$/g, '');
          var scaleMap = { '80': '11.2px', '90': '12.6px', '100': '14px', '110': '15.4px', '120': '16.8px' };
          var scalePx = scaleMap[scale] || '14px';
          document.documentElement.style.fontSize = scalePx;
          document.documentElement.setAttribute('data-ui-scale', scaleMap[scale] ? scale : '100');
          var isRtl = lang === 'ar' || lang === 'fa' || lang === 'ku';
          document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.classList.remove('rtl', 'ltr');
          document.documentElement.classList.add(isRtl ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
    <title>FlowPOS Pro - نظام إدارة محاسبي متكامل</title>
    
    <!-- App Icon / Favicon -->
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="description" content="نظام إدارة محاسبي متكامل لمحلات الهواتف والصيانة والمحلات التجارية" />
    <meta name="author" content="FlowPOS Pro" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="FlowPOS Pro - نظام إدارة محاسبي متكامل" />
    <meta property="og:description" content="نظام إدارة محاسبي متكامل لمحلات الهواتف والصيانة والمحلات التجارية" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FlowPOSPro" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body style="background-color: #0a0a0a; color: #fafafa;">
    <div id="root"></div>
    <script>
      // Offline fallback: Never overwrite or block #root so React can boot from local cache & IndexedDB
      if (!navigator.onLine && !navigator.serviceWorker?.controller) {
        var overlay = document.createElement('div');
        overlay.id = 'offline-fallback-screen';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:sans-serif;';
        overlay.innerHTML = '<div style="max-width:360px">'
          + '<p style="font-size:3rem;margin:0 0 0.5rem">📡</p>'
          + '<h2 style="color:#fff;margin:0.5rem 0 0.25rem;font-size:1.25rem">وضع عدم الاتصال</h2>'
          + '<p style="color:#a1a1aa;font-size:0.875rem;margin-bottom:1.5rem">يمكنك تشغيل التطبيق ومتابعة العمل على البيانات المخزنة محلياً</p>'
          + '<button id="btn-open-offline" style="background:#6d28d9;color:#fff;border:none;padding:0.75rem 1.75rem;border-radius:0.75rem;font-size:0.95rem;font-weight:600;cursor:pointer">فتح التطبيق في وضع عدم الاتصال</button>'
          + '</div>';
        document.body.appendChild(overlay);
        document.getElementById('btn-open-offline').onclick = function() {
          overlay.remove();
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
