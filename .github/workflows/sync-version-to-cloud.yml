name: Sync successful APK build to cloud

on:
  workflow_run:
    workflows: [Build FlowPOS Pro APK]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK build metadata from the successful run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          ARTIFACTS=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts")
          ARTIFACT_ID=$(printf '%s' "$ARTIFACTS" | jq -r \
            '[.artifacts[] | select(.name | startswith("FlowPOS-v")) | select(.expired == false)] | .[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo '::error::No unexpired APK artifact found for this successful build.'
            exit 1
          fi
          mkdir -p /tmp/flowpos-artifact
          curl --fail-with-body -sS -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/flowpos-artifact/artifact.zip
          unzip -q /tmp/flowpos-artifact/artifact.zip -d /tmp/flowpos-artifact/files
          test -s /tmp/flowpos-artifact/files/build-metadata.json
          cp /tmp/flowpos-artifact/files/build-metadata.json build-metadata.json
          cat build-metadata.json

      - name: Sync verified build metadata to Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo '::error::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be configured.'
            exit 1
          fi
          node --input-type=module <<'NODE' > sync-payload.json
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('build-metadata.json', 'utf8'));
          if (!Number.isSafeInteger(m.versionCode) || !m.versionName || !m.sha || !m.runId || !m.apkSha256) {
            throw new Error('Build metadata is incomplete; refusing to sync.');
          }
          const payload = {
            latest_version_code: m.versionCode,
            latest_version_name: m.versionName,
            commit_sha: m.sha,
            commit_message: `Successful APK build ${m.runId}`,
            build_run_id: String(m.runId),
            artifact_name: m.artifactName,
            apk_sha256: m.apkSha256,
            build_status: 'success'
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          STATUS=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            "${SUPABASE_URL}/functions/v1/sync-release-metadata" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --data @sync-payload.json)
          cat response.txt
          echo
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "::error::Supabase metadata sync failed with HTTP ${STATUS}."
            exit 1
          fi
