name: Build FlowPOS Pro Windows

on:
  push:
    branches: [ main, event-or-artifact ]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      ELECTRON_VER: '32.2.5'
      BUILDER_VER: '25.1.8'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-v${{ env.ELECTRON_VER }}

      - name: Read and unify application version
        shell: bash
        run: |
          if [ -f "./version.json" ]; then
            BASE_CODE=$(node -p "require('./version.json').versionCode || 256")
          else
            BASE_CODE="256"
          fi

          COMMIT_COUNT=$(git rev-list --count HEAD)
          OFFSET=$(( COMMIT_COUNT - 2700 ))
          if [ "$OFFSET" -lt 1 ]; then OFFSET=1; fi

          MAJOR=$(( 1 + (OFFSET / 100) ))
          MINOR=$(( OFFSET % 100 ))

          VERSION_NAME="${MAJOR}.${MINOR}"
          SEMVER_VERSION="${MAJOR}.${MINOR}.0"
          VERSION_CODE=$(( BASE_CODE + COMMIT_COUNT ))

          node -e "
            const fs = require('fs');
            for (const file of ['./version.json', './public/version.json']) {
              if (fs.existsSync(file)) {
                const v = JSON.parse(fs.readFileSync(file, 'utf8'));
                v.versionCode = $VERSION_CODE;
                v.versionName = '$VERSION_NAME';
                v.version = '$VERSION_NAME';
                fs.writeFileSync(file, JSON.stringify(v, null, 2));
              }
            }
            if (fs.existsSync('./package.json')) {
              const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
              pkg.main = 'electron/main.js';
              pkg.version = '$SEMVER_VERSION';
              pkg.description = 'FlowPOS Pro Point of Sale System';
              pkg.author = 'FlowPOS Pro';
              fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2));
            }
          "

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "SEMVER_VERSION=$SEMVER_VERSION" >> "$GITHUB_ENV"
          echo "Unified Version: v$VERSION_NAME (SemVer: $SEMVER_VERSION)"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Electron dependencies
        run: npm install --save-dev electron@${{ env.ELECTRON_VER }} electron-builder@${{ env.BUILDER_VER }} --legacy-peer-deps --no-audit --no-fund

      - name: Build web application
        shell: bash
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          VITE_VERSION_NAME: ${{ env.VERSION_NAME }}
          VITE_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          npm run build
          if [ -d "dist" ]; then
            find dist -name "*.map" -type f -delete
          fi

      - name: Create Electron Builder config
        shell: bash
        run: |
          cat > electron-builder.json << 'EOF'
          {
            "appId": "app.flowpos.pro",
            "productName": "FlowPOS Pro",
            "asar": true,
            "compression": "maximum",
            "directories": {
              "output": "electron-dist"
            },
            "files": [
              "dist/**/*",
              "electron/**/*",
              "resources/**/*",
              "!**/*.map"
            ],
            "extraResources": [
              {
                "from": "dist",
                "to": "dist",
                "filter": ["**/*", "!**/*.map"]
              }
            ],
            "win": {
              "target": [
                {
                  "target": "nsis",
                  "arch": ["x64"]
                }
              ],
              "icon": "resources/icon.png",
              "artifactName": "FlowPOS-Pro-Setup-v${env.VERSION_NAME}.exe"
            },
            "nsis": {
              "oneClick": false,
              "allowToChangeInstallationDirectory": true,
              "createDesktopShortcut": true,
              "createStartMenuShortcut": true,
              "shortcutName": "FlowPOS Pro"
            }
          }
          EOF

      - name: Pre-download Electron Binary with Retry
        shell: pwsh
        run: |
          $electronVersion = "v${{ env.ELECTRON_VER }}"
          $electronZip = "electron-$electronVersion-win32-x64.zip"
          $cacheDirs = @(
            "$env:LOCALAPPDATA\electron\Cache",
            "$env:LOCALAPPDATA\electron-builder\Cache\electron"
          )
          foreach ($dir in $cacheDirs) {
            if (-not (Test-Path $dir)) {
              New-Item -ItemType Directory -Force -Path $dir | Out-Null
            }
          }
          $dest1 = "$env:LOCALAPPDATA\electron\Cache\$electronZip"
          $dest2 = "$env:LOCALAPPDATA\electron-builder\Cache\electron\$electronZip"

          if (-not (Test-Path $dest1)) {
            $url = "https://github.com/electron/electron/releases/download/$electronVersion/$electronZip"
            Write-Host "Pre-downloading $url to $dest1..."
            curl.exe -fL --retry 5 --retry-connrefused --retry-delay 3 -o $dest1 $url
          } else {
            Write-Host "Electron binary already exists in cache."
          }

          if ((Test-Path $dest1) -and -not (Test-Path $dest2)) {
            Copy-Item -Path $dest1 -Destination $dest2 -Force
          }

      - name: Build Windows Installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          $maxRetries = 3
          $attempt = 0
          $success = $false
          while ($attempt -lt $maxRetries -and -not $success) {
            $attempt++
            Write-Host "=== Build Attempt $attempt of $maxRetries ==="
            npx electron-builder --win --config electron-builder.json --publish never
            if ($LASTEXITCODE -eq 0) {
              $success = $true
            } else {
              Write-Host "Attempt $attempt failed with exit code $LASTEXITCODE. Waiting 5s before retry..."
              Start-Sleep -Seconds 5
            }
          }
          if (-not $success) {
            exit 1
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: FlowPOS-Pro-Windows-v${{ env.VERSION_NAME }}
          path: electron-dist/*.exe
          retention-days: 30

      - name: Build Summary
        shell: pwsh
        run: |
          echo "## FlowPOS Pro Windows Build Complete! :rocket:" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $env:GITHUB_STEP_SUMMARY
          echo "| Version | v${{ env.VERSION_NAME }} (Internal: ${{ env.VERSION_CODE }}) |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Platform | Windows x64 |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Output | FlowPOS-Pro-Setup-v${{ env.VERSION_NAME }}.exe |" >> $env:GITHUB_STEP_SUMMARY
          echo "| Build Time | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') |" >> $env:GITHUB_STEP_SUMMARY
