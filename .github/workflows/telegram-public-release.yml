name: Telegram public release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'الفرع الذي تريد سحب نسخته وإرسالها للمستخدمين'
        required: true
        default: main
        type: choice
        options:
          - main
      confirm_publish:
        description: 'أؤكد إرسال ملف التطبيق الجاهز إلى قناة Telegram الآن'
        required: true
        default: false
        type: boolean
      custom_notes:
        description: 'ملاحظات التحديث لتليجرام (اختياري - اتركه فارغاً لجلب آخر التعديلات تلقائياً)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_branch }}

      - name: Read application version
        shell: bash
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          OFFSET=$(( COMMIT_COUNT - 2700 ))
          if [ "$OFFSET" -lt 1 ]; then OFFSET=1; fi
          
          MAJOR=$(( 1 + (OFFSET / 100) ))
          MINOR=$(( OFFSET % 100 ))
          VERSION_NAME="${MAJOR}.${MINOR}"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VER=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Verify and resolve Telegram Chat ID
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN is missing in GitHub Secrets"
            exit 1
          fi

          RAW_CHAT=$(echo "$RAW_CHAT" | tr -d '[:space:]')
          CANDIDATES=""

          if [ -n "$RAW_CHAT" ]; then
            CANDIDATES="$RAW_CHAT"
            if echo "$RAW_CHAT" | grep -qE '^[0-9]+$'; then
              CANDIDATES="$CANDIDATES -100$RAW_CHAT"
            fi
            if echo "$RAW_CHAT" | grep -qE '^[A-Za-z][A-Za-z0-9_]+$'; then
              CANDIDATES="$CANDIDATES @$RAW_CHAT"
            fi
          fi

          AUTO_CHATS=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" | jq -r '.result[]? | (.message.chat.id // .channel_post.chat.id // .my_chat_member.chat.id) | select(. != null)' 2>/dev/null | tac | uniq | tr '\n' ' ' || true)

          CANDIDATES="$CANDIDATES $AUTO_CHATS @flowpospro"

          for C in $CANDIDATES; do
            R=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getChat" --data-urlencode "chat_id=$C" || true)
            if echo "$R" | grep -q '"ok":true'; then
              echo "Verified Telegram target: $C"
              echo "CHANNEL=$C" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Target ($C) check failed: $R"
          done

          echo "Error: Bot cannot access the channel or chat."
          exit 1

      - name: Download Latest Ready APK from GitHub Artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_INFO=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=30" \
            | jq -r '.artifacts[] | select(.expired == false and (.name | test("FlowPOS.*"; "i")) and (.name | test("win|exe|setup"; "i") | not)) | "\(.id) \(.name)"' | head -n 1)

          if [ -z "$ARTIFACT_INFO" ]; then
            echo "::error::No ready APK artifact found."
            exit 1
          fi

          ARTIFACT_ID=$(echo "$ARTIFACT_INFO" | awk '{print $1}')
          ARTIFACT_NAME=$(echo "$ARTIFACT_INFO" | awk '{print $2}')

          ACTUAL_VER=$(echo "$ARTIFACT_NAME" | sed -E 's/^FlowPOS-v//i')
          if [ -n "$ACTUAL_VER" ]; then
            echo "VERSION_NAME=$ACTUAL_VER" >> "$GITHUB_ENV"
            echo "VER=$ACTUAL_VER" >> "$GITHUB_ENV"
          else
            ACTUAL_VER="${{ env.VER }}"
          fi

          mkdir -p /tmp/ready-apk
          curl -sS -L -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/ready-apk/artifact.zip

          unzip -q /tmp/ready-apk/artifact.zip -d /tmp/ready-apk
          FOUND_APK=$(find /tmp/ready-apk -name "*.apk" | head -n 1)

          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::Downloaded artifact does not contain an APK."
            exit 1
          fi

          FINAL_NAME="FlowPOS-v${ACTUAL_VER}.apk"
          cp "$FOUND_APK" "$GITHUB_WORKSPACE/$FINAL_NAME"
          ls -lh "$GITHUB_WORKSPACE/$FINAL_NAME"

          echo "APK_FILE=$FINAL_NAME" >> "$GITHUB_ENV"
          echo "APK_PATH=$GITHUB_WORKSPACE/$FINAL_NAME" >> "$GITHUB_ENV"

      - name: Send Ready APK to Telegram Channel
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: ${{ env.CHANNEL }}
          APK_PATH: ${{ env.APK_PATH }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found at $APK_PATH"
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          BUILD_DATE=$(TZ='Asia/Damascus' date +'%Y-%m-%d (%H:%M)')

          if [ -n "$CUSTOM_NOTES" ]; then
            RAW_NOTES="$CUSTOM_NOTES"
          elif [ -f "scripts/telegram-release-notes.cjs" ]; then
            RAW_NOTES=$(node scripts/telegram-release-notes.cjs)
          else
            RAW_NOTES=$(git log -3 --pretty=format:"• %s")
          fi

          SAFE_NOTES=$(echo "$RAW_NOTES" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="🚀 <b>تحديث جديد | Flow POS Pro</b>
          ━━━━━━━━━━━━━━
          📌 <b>الإصدار:</b> <code>v${{ env.VER }}</code>
          📦 <b>حجم الملف:</b> <code>${APK_SIZE}B</code>
          📅 <b>تاريخ النشر:</b> <code>${BUILD_DATE}</code>

          ✨ <b>أبرز التحديثات والإصلاحات:</b>
          <blockquote>${SAFE_NOTES}</blockquote>
          ━━━━━━━━━━━━━━
          💡 <i>يمكنك تثبيت هذا التحديث مباشرة فوق النسخة الحالية دون حذف بياناتك.</i>"

          REPLY_MARKUP='{"inline_keyboard":[[{"text":"📢 قناة التحديثات الرسمية","url":"https://t.me/flowpospro"}]]}'

          if [ ${#CAPTION} -le 1000 ]; then
            curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              --form-string "chat_id=${CHANNEL}" \
              -F "document=@${APK_PATH}" \
              --form-string "parse_mode=HTML" \
              --form-string "reply_markup=${REPLY_MARKUP}" \
              --form-string "caption=${CAPTION}"
          else
            jq -n --arg c "$CHANNEL" --arg t "$CAPTION" '{chat_id:$c,text:$t,parse_mode:"HTML"}' \
              | curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                -H 'Content-Type: application/json' -d @-
            curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              --form-string "chat_id=${CHANNEL}" \
              -F "document=@${APK_PATH}" \
              --form-string "parse_mode=HTML" \
              --form-string "reply_markup=${REPLY_MARKUP}" \
              --form-string "caption=📥 <b>Flow POS Pro</b> <code>v${{ env.VER }}</code>"
          fi
