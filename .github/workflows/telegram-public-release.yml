# عند الدفع إلى فرع النشرة العامة "public-release": يبني ملف Android ويرسله مباشرة إلى قناة Telegram.
# أسرار GitHub → Settings → Secrets → Actions:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (مطلوبة)
#   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (اختيارية: لتوقيع الملف ليتحدث فوق النسخة المثبتة)
name: Telegram public release
on:
  push:
    branches: [public-release]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web app
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npx cap sync android
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease --no-daemon
            APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          else
            ./gradlew assembleDebug --no-daemon
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          fi
          VER=$(node -p "require('../version.json').versionName")
          cp "$APK" "$GITHUB_WORKSPACE/FlowPOS-Pro-v$VER.apk"
          echo "APK_FILE=FlowPOS-Pro-v$VER.apk" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Send file to channel
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: ${{ secrets.TELEGRAM_CHAT_ID || '@flowpospro' }}
        run: |
          TEXT=$(node scripts/telegram-release-notes.cjs)
          if [ ${#TEXT} -le 1000 ]; then
            curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              -F chat_id="$CHANNEL" -F document=@"$APK_FILE" -F caption="$TEXT"
          else
            jq -n --arg c "$CHANNEL" --arg t "$TEXT" '{chat_id:$c,text:$t}' \
              | curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -H 'Content-Type: application/json' -d @-
            curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              -F chat_id="$CHANNEL" -F document=@"$APK_FILE" -F caption="📥 Flow POS Pro v$VER"
          fi
      - name: Archive in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Flow POS Pro v${{ env.VER }}
          files: ${{ env.APK_FILE }}
