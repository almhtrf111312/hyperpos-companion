name: Telegram public release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'الفرع الذي تريد نشر نسخته'
        required: true
        default: main
        type: choice
        options: [main]
      confirm_publish:
        description: 'أؤكد إرسال ملف التطبيق الجاهز إلى قناة Telegram الآن'
        required: true
        default: false
        type: boolean
      custom_notes:
        description: 'ملاحظات التحديث الاختيارية'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: ${{ inputs.confirm_publish == true }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_branch }}

      - name: Read source version and commit
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Publishing candidate: v${VERSION_NAME} build ${VERSION_CODE}, SHA ${SOURCE_SHA}"

      - name: Resolve exact successful APK build for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUNS_JSON=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/build-apk.yml/runs?branch=main&status=success&per_page=50")

          RUN_ID=$(printf '%s' "$RUNS_JSON" | jq -r --arg sha "$SOURCE_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | .[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful APK build exists for current main SHA ${SOURCE_SHA}. Build the current source before publishing."
            exit 1
          fi

          ARTIFACTS_JSON=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts")
          ARTIFACT_NAME="FlowPOS-v${VERSION_NAME}-build${VERSION_CODE}"
          ARTIFACT_ID=$(printf '%s' "$ARTIFACTS_JSON" | jq -r --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | .[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Build run ${RUN_ID} has no unexpired artifact named ${ARTIFACT_NAME}."
            exit 1
          fi

          mkdir -p /tmp/flowpos-release
          curl --fail-with-body -sS -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/flowpos-release/artifact.zip
          unzip -q /tmp/flowpos-release/artifact.zip -d /tmp/flowpos-release/files

          META=/tmp/flowpos-release/files/build-metadata.json
          if [ ! -s "$META" ]; then
            echo '::error::Build artifact is missing build-metadata.json.'
            exit 1
          fi
          META_SHA=$(jq -r '.sha' "$META")
          META_VERSION=$(jq -r '.versionName' "$META")
          META_CODE=$(jq -r '.versionCode' "$META")
          APK_NAME=$(jq -r '.apkName' "$META")
          if [ "$META_SHA" != "$SOURCE_SHA" ] || [ "$META_VERSION" != "$VERSION_NAME" ] || [ "$META_CODE" != "$VERSION_CODE" ]; then
            echo '::error::Artifact metadata does not match current main source/version; refusing to publish.'
            cat "$META"
            exit 1
          fi
          APK_PATH="/tmp/flowpos-release/files/${APK_NAME}"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected APK ${APK_NAME} was not present in the artifact."
            exit 1
          fi
          EXPECTED_HASH=$(jq -r '.apkSha256' "$META")
          ACTUAL_HASH=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo '::error::APK SHA-256 does not match build metadata.'
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "BUILD_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Verified exact artifact: run=${RUN_ID}, ${APK_NAME}, sha256=${ACTUAL_HASH}"

      - name: Verify Telegram target
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo '::error::TELEGRAM_BOT_TOKEN is missing.'
            exit 1
          fi
          RAW_CHAT=$(echo "$RAW_CHAT" | tr -d '[:space:]')
          if [ -z "$RAW_CHAT" ]; then RAW_CHAT='@flowpospro'; fi
          RESPONSE=$(curl --fail-with-body -sS \
            "https://api.telegram.org/bot${TOKEN}/getChat" \
            --data-urlencode "chat_id=${RAW_CHAT}")
          if ! echo "$RESPONSE" | jq -e '.ok == true' >/dev/null; then
            echo '::error::Telegram bot cannot access the configured channel/chat.'
            echo "$RESPONSE"
            exit 1
          fi
          echo "CHANNEL=$RAW_CHAT" >> "$GITHUB_ENV"

      - name: Send verified APK to Telegram
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: ${{ env.CHANNEL }}
          APK_PATH: ${{ env.APK_PATH }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          set -euo pipefail
          if [ ! -s "$APK_PATH" ]; then
            echo '::error::Verified APK file is missing.'
            exit 1
          fi
          if [ -n "$CUSTOM_NOTES" ]; then
            RAW_NOTES="$CUSTOM_NOTES"
          elif [ -f scripts/telegram-release-notes.cjs ]; then
            RAW_NOTES=$(node scripts/telegram-release-notes.cjs)
          else
            RAW_NOTES=$(git log -3 --pretty=format:'• %s')
          fi
          SAFE_NOTES=$(printf '%s' "$RAW_NOTES" | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          BUILD_DATE=$(TZ='Asia/Damascus' date +'%Y-%m-%d (%H:%M)')
          CAPTION="🚀 <b>تحديث جديد | FlowPOS Pro</b>
          ━━━━━━━━━━━━━━
          📌 <b>الإصدار:</b> <code>v${VERSION_NAME} (Build ${VERSION_CODE})</code>
          🔐 <b>Commit:</b> <code>${SOURCE_SHA:0:7}</code>
          📦 <b>حجم الملف:</b> <code>${APK_SIZE}</code>
          📅 <b>تاريخ النشر:</b> <code>${BUILD_DATE}</code>
          ✨ <b>أبرز التحديثات:</b>
          <blockquote>${SAFE_NOTES}</blockquote>
          ━━━━━━━━━━━━━━
          💡 <i>يمكن تثبيت التحديث فوق النسخة الحالية دون حذف البيانات.</i>"
          REPLY_MARKUP='{"inline_keyboard":[[{"text":"قناة التحديثات الرسمية","url":"https://t.me/flowpospro"}]]}'
          if [ ${#CAPTION} -le 1000 ]; then
            curl --fail-with-body -sS "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              --form-string "chat_id=${CHANNEL}" \
              -F "document=@${APK_PATH}" \
              --form-string 'parse_mode=HTML' \
              --form-string "reply_markup=${REPLY_MARKUP}" \
              --form-string "caption=${CAPTION}"
          else
            jq -n --arg c "$CHANNEL" --arg t "$CAPTION" '{chat_id:$c,text:$t,parse_mode:"HTML"}' \
              | curl --fail-with-body -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                -H 'Content-Type: application/json' -d @-
            curl --fail-with-body -sS "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              --form-string "chat_id=${CHANNEL}" \
              -F "document=@${APK_PATH}" \
              --form-string 'parse_mode=HTML' \
              --form-string "reply_markup=${REPLY_MARKUP}" \
              --form-string "caption=FlowPOS Pro v${VERSION_NAME} (Build ${VERSION_CODE})"
          fi
