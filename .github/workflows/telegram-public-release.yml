# عند الدفع إلى فرع "public-release": يبني APK موقّعاً ويرسله مباشرة إلى قناة Telegram.
# أسرار مطلوبة: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (@اسم_القناة أو -100xxxxxxxxxx)
name: Telegram public release

on:
  push:
    branches: [ public-release ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v5

      - name: Read version
        run: echo "VER=$(node -p "require('./version.json').versionName")" >> "$GITHUB_ENV"

      - name: Check Telegram channel access
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RAW_CHAT=$(echo "$RAW_CHAT" | tr -d '[:space:]')
          CANDIDATES=""
          if [ -n "$RAW_CHAT" ]; then
            CANDIDATES="$RAW_CHAT"
            # رقم بدون -100 → جرّب صيغة القناة أيضاً
            if echo "$RAW_CHAT" | grep -qE '^[0-9]+$'; then CANDIDATES="$CANDIDATES -100$RAW_CHAT"; fi
            # اسم بدون @ → أضفها
            if echo "$RAW_CHAT" | grep -qE '^[A-Za-z][A-Za-z0-9_]+$'; then CANDIDATES="$CANDIDATES @$RAW_CHAT"; fi
          fi
          CANDIDATES="$CANDIDATES @flowpospro"
          for C in $CANDIDATES; do
            R=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getChat" --data-urlencode "chat_id=$C")
            if echo "$R" | grep -q '"ok":true'; then
              echo "✅ القناة موجودة: $C"
              echo "CHANNEL=$C" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "❌ $C → $R"
          done
          echo "::error::البوت لا يرى القناة. ضع في TELEGRAM_CHAT_ID اسم القناة مثل @flowpospro أو رقماً يبدأ بـ -100، وأضف البوت مشرفاً في القناة مع صلاحية النشر."
          exit 1

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Setup signing key
        run: |
          KEYSTORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          if [ -z "$KEYSTORE_PASS" ] || ! keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
            KEYSTORE_PASS="flowpos123"; KEY_PASS="flowpos123"
          fi
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: flowpos-release.keystore
          KEY_ALIAS: flowpos
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          NAME="FlowPOS-Pro-v${VER}.apk"
          cp "$SRC" "$NAME"
          echo "APK_PATH=$GITHUB_WORKSPACE/$NAME" >> "$GITHUB_ENV"

      - name: Send APK to Telegram channel
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          TEXT=$(node scripts/telegram-release-notes.cjs)
          if [ ${#TEXT} -le 1000 ]; then
            curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              -F chat_id="$CHANNEL" -F document=@"$APK_PATH" -F caption="$TEXT"
          else
            jq -n --arg c "$CHANNEL" --arg t "$TEXT" '{chat_id:$c,text:$t}' \
              | curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" -H 'Content-Type: application/json' -d @-
            curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              -F chat_id="$CHANNEL" -F document=@"$APK_PATH" -F caption="📥 Flow POS Pro v${VER}"
          fi

      - name: Archive in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Flow POS Pro v${{ env.VER }}
          files: ${{ env.APK_PATH }}
