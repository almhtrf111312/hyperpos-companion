
name: Telegram public release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'الفرع الذي تريد بناء نسخته وإرسالها للمستخدمين'
        required: true
        default: main
        type: choice
        options:
          - main
      confirm_publish:
        description: 'أؤكد إرسال ملف التطبيق إلى قناة Telegram الآن'
        required: true
        default: false
        type: boolean
      custom_notes:
        description: 'ملاحظات التحديث لتليجرام (اختياري - اتركه فارغاً لجلب آخر التعديلات تلقائياً)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_branch }}

      - name: Read application version (Smart Decimal System)
        shell: bash
        run: |
          if [ -f "./version.json" ]; then
            BASE_CODE=$(node -p "require('./version.json').versionCode || 256")
          else
            BASE_CODE="256"
          fi

          # نفس معادلة الورك فلو الأساسي لضمان التطابق 100%
          COMMIT_COUNT=$(git rev-list --count HEAD)
          MAJOR=1
          MINOR=$(( COMMIT_COUNT / 10 ))
          PATCH=$(( COMMIT_COUNT % 10 ))

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$(( BASE_CODE + COMMIT_COUNT ))

          if [ -f "./version.json" ]; then
            node -e "
              const fs = require('fs');
              const v = JSON.parse(fs.readFileSync('./version.json', 'utf8'));
              v.versionCode = $VERSION_CODE;
              v.versionName = '$VERSION_NAME';
              fs.writeFileSync('./version.json', JSON.stringify(v, null, 2));
            "
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VER=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Verify and resolve Telegram Chat ID
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN is missing in GitHub Secrets"
            exit 1
          fi

          RAW_CHAT=$(echo "$RAW_CHAT" | tr -d '[:space:]')
          CANDIDATES=""

          if [ -n "$RAW_CHAT" ]; then
            CANDIDATES="$RAW_CHAT"
            if echo "$RAW_CHAT" | grep -qE '^[0-9]+$'; then
              CANDIDATES="$CANDIDATES -100$RAW_CHAT"
            fi
            if echo "$RAW_CHAT" | grep -qE '^[A-Za-z][A-Za-z0-9_]+$'; then
              CANDIDATES="$CANDIDATES @$RAW_CHAT"
            fi
          fi

          AUTO_CHATS=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" | jq -r '.result[]? | (.message.chat.id // .channel_post.chat.id // .my_chat_member.chat.id) | select(. != null)' 2>/dev/null | tac | uniq | tr '\n' ' ' || true)

          CANDIDATES="$CANDIDATES $AUTO_CHATS @flowpospro"

          for C in $CANDIDATES; do
            R=$(curl -sS "https://api.telegram.org/bot${TOKEN}/getChat" --data-urlencode "chat_id=$C" || true)
            if echo "$R" | grep -q '"ok":true'; then
              echo "Verified Telegram target: $C"
              echo "CHANNEL=$C" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Target ($C) check failed: $R"
          done

          echo "Error: Bot cannot access the channel or chat. Add the bot as Admin in your channel, send /start to the bot, or set TELEGRAM_CHAT_ID in GitHub Secrets."
          exit 1

      - name: Try fast-fetching ready APK from main build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FINAL_NAME="FlowPOS-v${{ env.VER }}.apk"
          echo "Checking if $FINAL_NAME is already built by build-apk.yml..."
          
          RUN_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-apk.yml/runs?branch=${{ inputs.source_branch }}&status=success&per_page=10" \
            | jq -r --arg sha "${{ github.sha }}" '.workflow_runs[] | select(.head_sha == $sha) | .id' | head -n 1 || true)

          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            mkdir -p /tmp/fast-apk
            if gh run download "$RUN_ID" -n "FlowPOS-v${{ env.VER }}" -D /tmp/fast-apk --repo "${{ github.repository }}" 2>/dev/null; then
              READY_APK=$(ls /tmp/fast-apk/*.apk 2>/dev/null | head -n 1)
              if [ -n "$READY_APK" ] && [ -f "$READY_APK" ]; then
                cp "$READY_APK" "$GITHUB_WORKSPACE/$FINAL_NAME"
                ls -lh "$GITHUB_WORKSPACE/$FINAL_NAME"
                echo "APK_FILE=$FINAL_NAME" >> "$GITHUB_ENV"
                echo "APK_PATH=$GITHUB_WORKSPACE/$FINAL_NAME" >> "$GITHUB_ENV"
                echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
                echo "⚡ Fast-fetched pre-built APK successfully! Skipping Java/Node/Gradle build."
                exit 0
              fi
            fi
          fi

          echo "No pre-built artifact found for this commit. Proceeding with normal build..."
          echo "SKIP_BUILD=false" >> "$GITHUB_ENV"

      - name: Setup Java
        if: env.SKIP_BUILD != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        if: env.SKIP_BUILD != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Gradle
        if: env.SKIP_BUILD != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        if: env.SKIP_BUILD != 'true'
        run: npm install --legacy-peer-deps

      - name: Build web app
        if: env.SKIP_BUILD != 'true'
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Sync to Android
        if: env.SKIP_BUILD != 'true'
        run: npx cap sync android

      - name: Setup release signing key
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          KEYSTORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"

          if [ -f "android/app/flowpos-release.keystore" ]; then
            if [ -z "$KEYSTORE_PASS" ] || ! keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
              KEYSTORE_PASS="flowpos123"
              KEY_PASS="flowpos123"
            fi
          fi

          echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=flowpos" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.SKIP_BUILD != 'true'
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: flowpos-release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: flowpos
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=all

      - name: Prepare APK file
        if: env.SKIP_BUILD != 'true'
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          FINAL_NAME="FlowPOS-v${{ env.VER }}.apk"
          cp "$SRC_APK" "$GITHUB_WORKSPACE/$FINAL_NAME"
          ls -lh "$GITHUB_WORKSPACE/$FINAL_NAME"
          echo "APK_FILE=$FINAL_NAME" >> "$GITHUB_ENV"
          echo "APK_PATH=$GITHUB_WORKSPACE/$FINAL_NAME" >> "$GITHUB_ENV"

      - name: Send APK to Telegram Channel
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL: ${{ env.CHANNEL }}
          APK_PATH: ${{ env.APK_PATH }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found at $APK_PATH"
            exit 1
          fi

          # حساب حجم الملف وتاريخ اليوم
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          BUILD_DATE=$(TZ='Asia/Damascus' date +'%Y-%m-%d | %I:%M %p')

          # تجهيز ملاحظات التحديث (يدوية، أو من السكريبت، أو آخر 3 تعديلات تلقائياً)
          if [ -n "$CUSTOM_NOTES" ]; then
            RAW_NOTES="$CUSTOM_NOTES"
          elif [ -f "scripts/telegram-release-notes.cjs" ]; then
            RAW_NOTES=$(node scripts/telegram-release-notes.cjs)
          else
            RAW_NOTES=$(git log -3 --pretty=format:"• %s")
          fi

          # تنظيف النص ليكون آمناً مع تنسيق HTML في تليجرام
          SAFE_NOTES=$(echo "$RAW_NOTES" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          # تصميم الكليشة الاحترافية مع نافذة اقتباس
          CAPTION="🚀 <b>تحديث جديد | Flow POS Pro</b>
          ━━━━━━━━━━━━━━
          📌 <b>رقم الإصدار:</b> <code>v${{ env.VER }}</code>
          🔢 <b>رقم البناء:</b> <code>${{ env.VERSION_CODE }}</code>
          📦 <b>حجم الملف:</b> <code>${APK_SIZE}</code>
          📅 <b>تاريخ النشر:</b> <code>${BUILD_DATE}</code>

          ✨ <b>أبرز التحديثات والإصلاحات:</b>
          <blockquote>${SAFE_NOTES}</blockquote>
          ━━━━━━━━━━━━━━
          💡 <i>يمكنك تثبيت هذا التحديث مباشرة فوق النسخة الحالية دون حذف بياناتك.</i>"

          # تصميم الأزرار التفاعلية الشفافة تحت الملف
          REPLY_MARKUP='{"inline_keyboard":[[{"text":"📢 قناة التحديثات الرسمية","url":"https://t.me/flowpospro"}]]}'

          # ملاحظة هامة: استخدام --form-string مع chat_id و caption يمنع curl من اعتبار @flowpospro ملفاً محلياً (الخطأ 26)
          if [ ${#CAPTION} -le 1000 ]; then
            curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              --form-string "chat_id=${CHANNEL}" \
              -F "document=@${APK_PATH}" \
              --form-string "parse_mode=HTML" \
              --form-string "reply_markup=${REPLY_MARKUP}" \
              --form-string "caption=${CAPTION}"
          else
            jq -n --arg c "$CHANNEL" --arg t "$CAPTION" '{chat_id:$c,text:$t,parse_mode:"HTML"}' \
              | curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                -H 'Content-Type: application/json' -d @-
            curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
              --form-string "chat_id=${CHANNEL}" \
              -F "document=@${APK_PATH}" \
              --form-string "parse_mode=HTML" \
              --form-string "reply_markup=${REPLY_MARKUP}" \
              --form-string "caption=📥 <b>Flow POS Pro</b> <code>v${{ env.VER }}</code>"
          fi
