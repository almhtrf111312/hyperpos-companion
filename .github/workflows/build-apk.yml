name: Build FlowPOS Pro APK

on:
  push:
    branches: [ main, event-or-artifact ]
    tags: ['v*']
  workflow_dispatch:

# إلغاء أي عملية بناء قديمة قيد التشغيل لنفس الفرع إذا تم دفع تعديل جديد
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: '256'
      VERSION_NAME: '1.0.26'
      FINAL_APK_PATH: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read and update application version
        shell: bash
        run: |
          if [ -f "./version.json" ]; then
            BASE_CODE=$(node -p "require('./version.json').versionCode || 256")
            BASE_NAME=$(node -p "require('./version.json').versionName || '1.0.26'")
          else
            BASE_CODE="256"
            BASE_NAME="1.0.26"
          fi

          # الاعتماد على عدد الـ Commits الفعلي لضمان تطابق الإصدار 100% في جميع ملفات الورك فلو
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_NAME="${BASE_NAME}-b${COMMIT_COUNT}"
          VERSION_CODE=$(( BASE_CODE + COMMIT_COUNT ))

          if [ -f "./version.json" ]; then
            node -e "
              const fs = require('fs');
              const v = JSON.parse(fs.readFileSync('./version.json', 'utf8'));
              v.versionCode = $VERSION_CODE;
              v.versionName = '$VERSION_NAME';
              fs.writeFileSync('./version.json', JSON.stringify(v, null, 2));
            "
          fi

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo " building version: $VERSION_NAME (code: $VERSION_CODE)"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Setup release signing key
        shell: bash
        # Always sign with the SAME committed key so new APKs install over old ones
        run: |
          KEYSTORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"

          # Verify if KEYSTORE_PASS can unlock the existing keystore, otherwise use fallback password (by owner decision)
          if [ -f "android/app/flowpos-release.keystore" ]; then
            if [ -z "$KEYSTORE_PASS" ] || ! keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
              KEYSTORE_PASS="flowpos123"
              KEY_PASS="flowpos123"
            fi
          else
            echo "::error::Release keystore file android/app/flowpos-release.keystore is missing from repository. Build aborted to protect signing key integrity."
            exit 1
          fi

          echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=flowpos" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: flowpos-release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: flowpos
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=all

      - name: Prepare single versioned APK
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          FINAL_APK="FlowPOS-v${VERSION}.apk"
          
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          
          if [ "$SRC_APK" != "$RELEASE_DIR/$FINAL_APK" ]; then
            mv "$SRC_APK" "$RELEASE_DIR/$FINAL_APK"
          fi
          
          find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "$FINAL_APK" -delete
          
          # حفظ بيانات الإصدار بجانب الـ APK ليتمكن ورك فلو التليجرام من قراءتها فوراً دون إعادة بناء
          cat <<EOF > "$RELEASE_DIR/release-meta.env"
          VERSION_NAME=${{ env.VERSION_NAME }}
          VERSION_CODE=${{ env.VERSION_CODE }}
          FINAL_APK_NAME=${FINAL_APK}
          COMMIT_SHA=${{ github.sha }}
          EOF

          echo "FINAL_APK_NAME=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_APK_PATH=$RELEASE_DIR/$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_DIR"

      - name: Upload APK artifact (Versioned)
        uses: actions/upload-artifact@v4
        with:
          name: FlowPOS-v${{ env.VERSION_NAME }}
          path: ${{ env.FINAL_APK_PATH }}
          retention-days: 30

      - name: Upload Latest Ready APK for Telegram
        uses: actions/upload-artifact@v4
        with:
          name: FlowPOS-latest-apk
          path: |
            ${{ env.FINAL_APK_PATH }}
            android/app/build/outputs/apk/release/release-meta.env
          retention-days: 30

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
