name: Build FlowPOS Pro APK

on:
  push:
    branches: [ main, event-or-artifact ]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/telegram-public-release.yml'
      - '.github/workflows/sync-version-to-cloud.yml'
  workflow_dispatch:
    inputs:
      publish_telegram:
        description: 'إرسال ملف الـ APK المبني في هذه الجلسة إلى قناة Telegram مباشرة'
        required: false
        default: false
        type: boolean
      custom_notes:
        description: 'ملاحظات مخصصة للنشر (اختياري)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Java (Temurin JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read authoritative version
        shell: bash
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building FlowPOS Pro: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          VITE_VERSION_NAME: ${{ env.VERSION_NAME }}
          VITE_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Setup release signing key
        shell: bash
        run: |
          KEYSTORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"

          if [ -f "android/app/flowpos-release.keystore" ]; then
            if [ -z "$KEYSTORE_PASS" ] || ! keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
              KEYSTORE_PASS="flowpos123"
              KEY_PASS="flowpos123"
            fi
          else
            echo "::error::Release keystore file is missing. Aborting."
            exit 1
          fi

          echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=flowpos" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: flowpos-release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: flowpos
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=all

      - name: Prepare single versioned APK
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          FINAL_APK="FlowPOS-v${VERSION}.apk"
          
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          
          mv "$SRC_APK" "$RELEASE_DIR/$FINAL_APK"
          find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "$FINAL_APK" -delete
          
          echo "FINAL_APK_NAME=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_APK_PATH=$RELEASE_DIR/$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_DIR/$FINAL_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowPOS-v${{ env.VERSION_NAME }}
          path: ${{ env.FINAL_APK_PATH }}
          retention-days: 30

      - name: Publish exact APK to Telegram (If Requested)
        if: ${{ inputs.publish_telegram == true }}
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RAW_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ env.FINAL_APK_PATH }}
          CUSTOM_NOTES: ${{ inputs.custom_notes }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi

          CHANNEL=$(echo "$RAW_CHAT" | tr -d '[:space:]')
          if echo "$CHANNEL" | grep -qE '^[0-9]+$'; then
            CHANNEL="-100$CHANNEL"
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          BUILD_DATE=$(TZ='Asia/Damascus' date +'%Y-%m-%d (%H:%M)')

          if [ -n "$CUSTOM_NOTES" ]; then
            RAW_NOTES="$CUSTOM_NOTES"
          elif [ -f "scripts/telegram-release-notes.cjs" ]; then
            RAW_NOTES=$(node scripts/telegram-release-notes.cjs)
          else
            RAW_NOTES=$(git log -3 --pretty=format:"• %s")
          fi

          SAFE_NOTES=$(echo "$RAW_NOTES" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          CAPTION="🚀 <b>تحديث جديد | Flow POS Pro</b>
          ━━━━━━━━━━━━━━
          📌 <b>الإصدار:</b> <code>v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})</code>
          📦 <b>حجم الملف:</b> <code>${APK_SIZE}B</code>
          📅 <b>تاريخ النشر:</b> <code>${BUILD_DATE}</code>

          ✨ <b>أبرز التحديثات والإصلاحات:</b>
          <blockquote>${SAFE_NOTES}</blockquote>
          ━━━━━━━━━━━━━━
          💡 <i>يمكنك تثبيت هذا التحديث مباشرة فوق النسخة الحالية دون حذف بياناتك.</i>"

          REPLY_MARKUP='{"inline_keyboard":[[{"text":"📢 قناة التحديثات الرسمية","url":"https://t.me/flowpospro"}]]}'

          curl -sS --fail-with-body "https://api.telegram.org/bot${TOKEN}/sendDocument" \
            --form-string "chat_id=${CHANNEL}" \
            -F "document=@${APK_PATH}" \
            --form-string "parse_mode=HTML" \
            --form-string "reply_markup=${REPLY_MARKUP}" \
            --form-string "caption=${CAPTION}"

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
