name: Build FlowPOS Pro APK

on:
  push:
    branches: [ main, event-or-artifact ]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: '256'
      VERSION_NAME: '1.0'
      FINAL_APK_PATH: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Read application version & activate 4th digit
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("./version.json", "utf8"));
            const baseVersion = String(v.versionName || "1.5.2").split(".").slice(0, 3).join(".");
            const nextCode = parseInt(v.versionCode || 366, 10) + 1;
            v.versionCode = nextCode;
            v.versionName = `${baseVersion}.${nextCode}`;
            fs.writeFileSync("./version.json", JSON.stringify(v, null, 2) + "\n");
          '
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          VERSION_CODE=$(node -p "require('./version.json').versionCode")
          
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Target Version: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_APP_VERSION: ${{ env.VERSION_NAME }}
          VITE_VERSION_NAME: ${{ env.VERSION_NAME }}
          VITE_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Setup release signing key
        shell: bash
        run: |
          KEYSTORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"

          if [ -f "android/app/flowpos-release.keystore" ]; then
            if [ -z "$KEYSTORE_PASS" ] || ! keytool -list -keystore android/app/flowpos-release.keystore -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
              KEYSTORE_PASS="flowpos123"
              KEY_PASS="flowpos123"
            fi
          else
            echo "::error::Release keystore file android/app/flowpos-release.keystore is missing from repository. Build aborted to protect signing key integrity."
            exit 1
          fi

          echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=flowpos" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: flowpos-release.keystore
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: flowpos
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=all

      - name: Prepare single versioned APK
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          FINAL_APK="FlowPOS-v${VERSION}.apk"
          
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          
          if [ "$SRC_APK" != "$RELEASE_DIR/$FINAL_APK" ]; then
            mv "$SRC_APK" "$RELEASE_DIR/$FINAL_APK"
          fi
          
          find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "$FINAL_APK" -delete
          
          echo "FINAL_APK_NAME=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_APK_PATH=$RELEASE_DIR/$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_DIR"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowPOS-v${{ env.VERSION_NAME }}
          path: ${{ env.FINAL_APK_PATH }}
          retention-days: 30

      - name: Save bumped version.json & Sync to Supabase Cloud
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: release v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }}) [skip ci]" || true
          git push origin HEAD:main || true

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            node -e '
              const fs = require("fs");
              const { execSync } = require("child_process");
              const v = JSON.parse(fs.readFileSync("./version.json", "utf8"));
              const msg = execSync("git log -1 --pretty=%B", { encoding: "utf-8" }).trim().split("\n")[0];
              fs.writeFileSync("sync-payload.json", JSON.stringify({
                latest_version_code: v.versionCode,
                latest_version_name: v.versionName,
                commit_sha: process.env.COMMIT_SHA,
                commit_message: msg
              }));
            '
            curl -s -X POST "${SUPABASE_URL}/functions/v1/sync-release-metadata" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --data @sync-payload.json || true
          fi

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
