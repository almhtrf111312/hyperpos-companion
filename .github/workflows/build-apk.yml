name: Build FlowPOS Pro APK

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read and update application version
        shell: bash
        run: |
          if [ -f "./version.json" ]; then
            BASE_CODE=$(node -p "require('./version.json').versionCode || 256")
            BASE_NAME=$(node -p "require('./version.json').versionName || '1.0.26'")
          else
            BASE_CODE="256"
            BASE_NAME="1.0.26"
          fi

          RUN_NUM="${{ github.run_number }}"
          # Dynamic version: e.g. 1.0.26-b38
          VERSION_NAME="${BASE_NAME}-b${RUN_NUM}"
          VERSION_CODE=$(( BASE_CODE + RUN_NUM ))

          # Update version.json so Vite (__APP_VERSION__) and build.gradle both use this build version
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('./version.json', 'utf8'));
            v.versionCode = $VERSION_CODE;
            v.versionName = '$VERSION_NAME';
            fs.writeFileSync('./version.json', JSON.stringify(v, null, 2));
          "

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Setup release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FALLBACK_KEYSTORE_B64: ""
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom repository signing key..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/flowpos-release.keystore
            echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Using persistent repository release signing key..."
            echo "$FALLBACK_KEYSTORE_B64" | base64 -d > android/app/flowpos-release.keystore
            echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=flowpos123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=flowpos" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=flowpos123" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare single versioned APK
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          
          # Single clean APK with short version name (e.g. FlowPOS-v1.0.26.apk)
          FINAL_APK="FlowPOS-v${VERSION}.apk"
          
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          
          echo "Found release APK: $SRC_APK"
          if [ "$SRC_APK" != "$RELEASE_DIR/$FINAL_APK" ]; then
            mv "$SRC_APK" "$RELEASE_DIR/$FINAL_APK"
          fi
          
          # Ensure strictly only the final APK exists (remove duplicates/extras)
          find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "$FINAL_APK" -delete
          
          echo "FINAL_APK_NAME=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_APK_PATH=$RELEASE_DIR/$FINAL_APK" >> "$GITHUB_ENV"
          
          echo "=== Release directory (guaranteed single APK) ==="
          ls -lh "$RELEASE_DIR"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowPOS-v${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/FlowPOS-v${{ env.VERSION_NAME }}.apk
          retention-days: 30

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
