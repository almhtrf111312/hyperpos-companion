name: Build FlowPOS Pro APK
# 
# SECURITY: This workflow requires GitHub Secrets for release signing.
# Repository admins must configure: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# See the "Setup release signing key" step below for detailed instructions.
#

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: '256'
      VERSION_NAME: '1.0.26'
      FINAL_APK_PATH: ''
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Read and update application version
        shell: bash
        run: |
          if [ -f "./version.json" ]; then
            BASE_CODE=$(node -p "require('./version.json').versionCode || 256")
            BASE_NAME=$(node -p "require('./version.json').versionName || '1.0.26'")
          else
            BASE_CODE="256"
            BASE_NAME="1.0.26"
          fi

          RUN_NUM="${{ github.run_number }}"
          VERSION_NAME="${BASE_NAME}-b${RUN_NUM}"
          VERSION_CODE=$(( BASE_CODE + RUN_NUM ))

          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('./version.json', 'utf8'));
            v.versionCode = $VERSION_CODE;
            v.versionName = '$VERSION_NAME';
            fs.writeFileSync('./version.json', JSON.stringify(v, null, 2));
          "

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Setup release signing key
        shell: bash
        # Decode keystore from GitHub Secrets to ensure signing key is never committed
        # Repository admins must configure secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not configured."
            echo "Repository admins must add the following secrets to GitHub:"
            echo "  - KEYSTORE_BASE64: Base64-encoded keystore file"
            echo "  - KEYSTORE_PASSWORD: Keystore password"
            echo "  - KEY_ALIAS: Key alias"
            echo "  - KEY_PASSWORD: Key password"
            echo ""
            echo "To generate a new keystore and encode it:"
            echo "  keytool -genkeypair -v -keystore flowpos-release.keystore -alias flowpos \\"
            echo "    -keyalg RSA -keysize 2048 -validity 10000 \\"
            echo "    -storepass YOUR_STORE_PASSWORD -keypass YOUR_KEY_PASSWORD"
            echo "  base64 -i flowpos-release.keystore | pbcopy  # or use 'base64 -w 0' on Linux"
            exit 1
          fi
          
          # Decode keystore from base64 secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/flowpos-release.keystore
          
          # Verify keystore was created successfully
          if [ ! -f android/app/flowpos-release.keystore ]; then
            echo "Error: Failed to decode keystore from KEYSTORE_BASE64 secret"
            exit 1
          fi
          
          # Set environment variables from secrets
          echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode=all

      - name: Prepare single versioned APK
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          FINAL_APK="FlowPOS-v${VERSION}.apk"
          
          SRC_APK=$(ls $RELEASE_DIR/*.apk 2>/dev/null | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "Error: No APK found in $RELEASE_DIR"
            exit 1
          fi
          
          if [ "$SRC_APK" != "$RELEASE_DIR/$FINAL_APK" ]; then
            mv "$SRC_APK" "$RELEASE_DIR/$FINAL_APK"
          fi
          
          find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "$FINAL_APK" -delete
          
          echo "FINAL_APK_NAME=$FINAL_APK" >> "$GITHUB_ENV"
          echo "FINAL_APK_PATH=$RELEASE_DIR/$FINAL_APK" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_DIR"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: FlowPOS-v${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/release/FlowPOS-v${{ env.VERSION_NAME }}.apk
          retention-days: 30

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FINAL_APK_PATH }}
          generate_release_notes: true
