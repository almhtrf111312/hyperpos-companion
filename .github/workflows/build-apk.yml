name: Build FlowPOS Pro APK

on:
  push:
    branches: [ main ]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read application version
        shell: bash
        run: |
          if [ -f "./version.json" ]; then
            VERSION_CODE=$(node -p "require('./version.json').versionCode || 1")
            VERSION_NAME=$(node -p "require('./version.json').versionName || '1.0.0'")
          else
            VERSION_CODE="1"
            VERSION_NAME="1.0.0"
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build embedded web application
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: Sync embedded files to Android
        run: npx cap sync android

      - name: Setup release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom repository signing key..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/flowpos-release.keystore
            echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Generating production release signing keystore..."
            keytool -genkeypair -v \
              -keystore android/app/flowpos-release.keystore \
              -alias flowpos \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass flowpos123 \
              -keypass flowpos123 \
              -dname "CN=FlowPOS Pro, OU=POS, O=FlowPOS, L=Global, ST=Global, C=US"
            echo "KEYSTORE_PATH=flowpos-release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=flowpos123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=flowpos" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=flowpos123" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ env.VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare versioned APK files
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          VERSION="${{ env.VERSION_NAME }}"
          BUILD_CODE="${{ env.VERSION_CODE }}"
          RUN_NUM="${{ github.run_number }}"
          
          # Distinct, versioned filename with strictly increasing build number
          VERSIONED_APK="FlowPOS-Pro-v${VERSION}-b${BUILD_CODE}-build${RUN_NUM}.apk"
          
          echo "Copying APK to: $VERSIONED_APK"
          cp "$RELEASE_DIR/app-release.apk" "$RELEASE_DIR/$VERSIONED_APK"
          
          echo "VERSIONED_APK_NAME=$VERSIONED_APK" >> "$GITHUB_ENV"
          echo "VERSIONED_APK_PATH=$RELEASE_DIR/$VERSIONED_APK" >> "$GITHUB_ENV"
          
          echo "=== Release directory contents ==="
          ls -lh "$RELEASE_DIR"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowPOS-Pro-v${{ env.VERSION_NAME }}-b${{ env.VERSION_CODE }}-build${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/FlowPOS-Pro-*.apk
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.VERSIONED_APK_PATH }}
            android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
